[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "readiness-kit"
version = "0.1.0"
description = "The open-source frame under the Agent Readiness Gate: an evaluation harness with a held-out split, a starter attack pack mapped to OWASP ASI01-ASI10, adapters for the open agent scanners, an eight-area readiness scorecard, a CycloneDX Agent BOM emitter and a cost-per-task baseline."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Rainkernel Technologies Private Limited", email = "oss@rainkernel.com" }]
keywords = ["ai-agents", "llm", "security", "evaluation", "owasp", "mcp", "cyclonedx", "sbom", "readiness"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
benchmark = [
  "datasets>=2.19",
]

[project.scripts]
rk = "readiness_kit.cli:main"

[project.urls]
Homepage = "https://rainkernel.com/open-source"
Documentation = "https://github.com/rainkernel/readiness-kit/tree/main/docs"
Repository = "https://github.com/rainkernel/readiness-kit"
Issues = "https://github.com/rainkernel/readiness-kit/issues"
Changelog = "https://github.com/rainkernel/readiness-kit/blob/main/CHANGELOG.md"
"Sample Evidence Report" = "https://rainkernel.com/products/agent-readiness-gate/sample-report"

[tool.hatch.build.targets.wheel]
packages = ["src/readiness_kit"]

[tool.hatch.build.targets.wheel.force-include]
"rubric" = "readiness_kit/_data/rubric"
"attack-pack" = "readiness_kit/_data/attack-pack"
"schemas" = "readiness_kit/_data/schemas"
"examples/ticket-triage-agent" = "readiness_kit/_data/examples/ticket-triage-agent"

[tool.hatch.build.targets.sdist]
include = [
  "src/readiness_kit",
  "rubric",
  "attack-pack",
  "schemas",
  "examples",
  "docs",
  "tests",
  "README.md",
  "LICENSE",
  "NOTICE",
  "CHANGELOG.md",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012"]
allowed-confusables = ["×", "–", "·"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
