name: release

# Runs when a version tag is pushed (v0.1.0). Order: the tag must match the version in pyproject.toml, the
# package and the changelog; build and check the distributions; publish to PyPI through the trusted publisher
# (no API token anywhere); create the GitHub release with the artefacts and the changelog section; then install
# the published package on fresh machines and run the demo. RELEASING.md is the checklist around this file.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: tag matches the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pyproject="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          package="$(python -c 'import sys; sys.path.insert(0, "src"); import readiness_kit; print(readiness_kit.__version__)')"
          echo "tag=$tag pyproject=$pyproject package=$package"
          test "$tag" = "$pyproject"
          test "$tag" = "$package"
          grep -q "^## \[$tag\] - " CHANGELOG.md
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: build and check the distributions
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Wheel installs and runs from a clean environment
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install -q dist/*.whl
          cd "$(mktemp -d)" && /tmp/clean/bin/rk version && /tmp/clean/bin/rk demo -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [check, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/readiness-kit/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true

  github-release:
    name: GitHub release
    needs: [check, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - name: Release notes from the changelog section
        shell: bash
        run: |
          awk -v v="${{ needs.check.outputs.version }}" '
            $0 ~ "^## \\[" v "\\] - " { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\nInstall: `pip install readiness-kit==%s`\n' "${{ needs.check.outputs.version }}" >> notes.md
          test -s notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Readiness Kit $GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  verify:
    name: install from PyPI (${{ matrix.os }})
    needs: [check, publish]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the published version (PyPI takes a minute to serve a new file)
        shell: bash
        run: |
          v="${{ needs.check.outputs.version }}"
          for i in $(seq 1 12); do
            if python -m pip install --no-cache-dir "readiness-kit==$v"; then break; fi
            echo "not served yet, attempt $i"; sleep 30
          done
          rk version
      - name: Demo runs end to end
        shell: bash
        run: |
          cd "$(mktemp -d)"
          rk demo -q
          rk validate scorecard rk-demo/runs/scorecard.json
