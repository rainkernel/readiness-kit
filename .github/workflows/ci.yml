name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples && ruff format --check src tests examples
      - name: Tests
        run: pytest -q
      - name: Demo runs end to end
        run: |
          cd "$(mktemp -d)"
          rk demo -q
          rk validate scorecard rk-demo/runs/scorecard.json
          rk validate bom rk-demo/runs/bom.cdx.json
      - name: Starter pack and schemas validate
        run: |
          for f in attack-pack/starter/*.yaml; do rk validate pack "$f"; done
          rk validate evalset examples/ticket-triage-agent/evalset.jsonl
          rk validate manifest examples/ticket-triage-agent/agent.yaml
          rk validate rubric rubric/readiness-rubric.yaml

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine && python -m build && python -m twine check --strict dist/*
      - name: Wheel installs and runs from a clean environment
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install -q dist/*.whl
          cd "$(mktemp -d)" && /tmp/clean/bin/rk demo -q
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the Kit into a clean environment and list its dependency tree
        run: |
          python -m venv /tmp/audit && /tmp/audit/bin/pip install -q --upgrade pip && /tmp/audit/bin/pip install -q .
          /tmp/audit/bin/pip freeze --exclude-editable | grep -v -i '^readiness[-_]kit' > /tmp/deps.txt
          cat /tmp/deps.txt
      - name: Known vulnerabilities in that tree
        run: python -m pip install --upgrade pip pip-audit && python -m pip_audit -r /tmp/deps.txt --no-deps --desc on
